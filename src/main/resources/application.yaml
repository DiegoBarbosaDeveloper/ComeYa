spring:
  application:
    name: comeya
  datasource:
    url: "${DATABASE_URL}"
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true


  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: "${JWT_SECRET}"
  expiration-ms: "${JWT_EXPIRATION_MS}"

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:15}

wompi:
  base-url: "${WOMPI_BASE_URL}"
  public-key: "${WOMPI_PUBLIC_KEY}"
  private-key: "${WOMPI_PRIVATE_KEY}"
  integrity-key: "${WOMPI_INTEGRITY_KEY}"
  webhook-secret: "${WOMPI_WEBHOOK_SECRET}"

